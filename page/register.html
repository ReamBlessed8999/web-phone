<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register — Angkor Mass Store</title>
  <link rel="stylesheet" href="../css/style.css">
</head>
<body>

  <div class="topbar"></div>

  <header>
    <div class="header-inner">
      <a href="index.html" class="logo">
        <span class="logo-kh">អង្គរមាស</span>
        <span class="logo-sub">ANGKOR MASS STORE</span>
      </a>
    </div>
  </header>

  <div class="auth-shell">
    <div class="auth-wrap">
      <h2>Create Account</h2>
      <p class="auth-subtitle">Join Angkor Mass Store today</p>

      <div class="auth-msg" id="registerMsg"></div>

      <!-- Requirement 6: public registration always creates role: "user" -->
      <form id="registerForm">
        <div class="form-group">
          <label for="regName">Full Name</label>
          <input type="text" id="regName" placeholder="John Doe" required>
        </div>

        <div class="form-group">
          <label for="regEmail">Email Address</label>
          <input type="email" id="regEmail" placeholder="example@gmail.com" required>
        </div>

        <div class="form-group">
          <label for="regPassword">Password</label>
          <input type="password" id="regPassword" placeholder="At least 6 characters" required minlength="6">
        </div>

        <div class="form-group">
          <label for="regConfirmPassword">Confirm Password</label>
          <input type="password" id="regConfirmPassword" placeholder="Re-enter password" required minlength="6">
        </div>

        <button type="submit" class="auth-submit-btn btn-primary">Register</button>
      </form>

      <div class="auth-switch">
        Already have an account? <a href="login.html">Login here</a>
      </div>
    </div>
  </div>

  <footer>
    <div class="footer-bottom">&copy; 2026 Angkor Mass Store. All rights reserved.</div>
  </footer>

  <script src="../js/app.js"></script>
  <script src="../js/auth.js"></script>
  <script src="../js/products.js"></script>
  <script src="../js/cart.js"></script>
  <script src="../js/register.js"></script>
</body>
</html>
