<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Checkout — Angkor Mass Store</title>
  <!-- <link rel="stylesheet" href="../css/style.css"> -->
  <link rel="stylesheet" href="../css/checkout.css">
</head>
<body>

  <div class="topbar"></div>

  <header>
    <div class="header-inner">
      <a class="logo" href="index.html"><span class="logo-kh">Market Phone</span></a>
      <div class="header-icons">
        <button aria-label="cart" onclick="openCartSidebar()">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/><path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"/>
          </svg>
          <span id="cartBadge" style="display:none;">0</span>
        </button>
      </div>
    </div>
  </header>

  <nav>
    <button class="nav-toggle" id="navToggleBtn">☰ Menu</button>
    <div class="nav-inner"></div>
  </nav>

  <main>
    <div class="page-header">
      <h1>Checkout</h1>
      <p>Confirm your delivery details and place your order</p>
    </div>

    <div class="checkout-layout">
      <div class="checkout-form-card">
        <h2 class="section-title">Delivery Details</h2>
        <form id="checkoutForm">
          <div class="form-group">
            <label for="checkoutName">Full Name</label>
            <input type="text" id="checkoutName" required>
          </div>
          <div class="form-group">
            <label for="checkoutEmail">Email</label>
            <input type="email" id="checkoutEmail" disabled>
          </div>
          <div class="form-group">
            <label for="checkoutPhone">Phone Number</label>
            <input type="tel" id="checkoutPhone" placeholder="+855 ..." required>
          </div>
          <div class="form-group">
            <label for="checkoutAddress">Delivery Address</label>
            <input type="text" id="checkoutAddress" placeholder="Street, house number" required>
          </div>
          <div class="form-group">
            <label for="checkoutCity">City / Province</label>
            <input type="text" id="checkoutCity" required>
          </div>

          <div class="form-group">
            <label>Payment Method</label>
            <div class="pay-methods">
              <label class="pay-method-opt">
                <input type="radio" name="paymentMethod" value="Cash on Delivery" checked> 💵 Cash on Delivery
              </label>
              <label class="pay-method-opt">
                <input type="radio" name="paymentMethod" value="Credit / Debit Card"> 💳 Credit / Debit Card
              </label>
              <label class="pay-method-opt">
                <input type="radio" name="paymentMethod" value="Bank Transfer"> 🏦 Bank Transfer
              </label>
            </div>
          </div>

          <button type="submit" class="btn-primary" style="margin-top:10px;">Confirm Order</button>
        </form>
      </div>

      <div class="checkout-summary-card">
        <h2 class="section-title">Order Summary</h2>
        <div id="checkoutItemsList"></div>
        <div id="checkoutTotals" style="margin-top:14px;"></div>
      </div>
    </div>
  </main>

  <footer>
    <div class="footer-bottom">&copy; 2026 Angkor Mass Store. All rights reserved.</div>
  </footer>

  <script src="../js/app.js"></script>
  <script src="../js/auth.js"></script>
  <script src="../js/products.js"></script>
  <script src="../js/cart.js"></script>
  <script src="../js/orders.js"></script>
  <script src="../js/main.js"></script>
</body>
</html>
