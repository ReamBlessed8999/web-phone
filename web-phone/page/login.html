<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login — Angkor Mass Store</title>
  <link rel="stylesheet" href="../css/style.css">
</head>
<body>

  <div class="topbar"></div>

  <header>
    <div class="header-inner">
      <a href="index.html" class="logo">
        <span class="logo-kh">អង្គរមាស</span>
        <span class="logo-sub">ANGKOR MASS STORE</span>
      </a>
    </div>
  </header>

  <div class="auth-shell">
    <div class="auth-wrap">
      <h2>Welcome Back</h2>
      <p class="auth-subtitle">Please log in to your account</p>

      <div class="auth-msg" id="loginMsg"></div>

      <form id="loginForm">
        <div class="form-group">
          <label for="loginEmail">Email Address</label>
          <input type="email" id="loginEmail" placeholder="example@gmail.com" required>
        </div>

        <div class="form-group">
          <label for="loginPassword">Password</label>
          <input type="password" id="loginPassword" placeholder="••••••••" required>
        </div>

        <button type="submit" class="auth-submit-btn btn-primary">Log In</button>
      </form>

      <div class="auth-switch">
        Don't have an account? <a href="register.html">Register here</a>
      </div>
      <div class="auth-switch" style="margin-top:8px; font-size:12px;">
        Admin demo login: admin@angkormass.com / admin123
      </div>
    </div>
  </div>

  <footer>
    <div class="footer-bottom">&copy; 2026 Angkor Mass Store. All rights reserved.</div>
  </footer>

  <script src="../js/app.js"></script>
  <script src="../js/auth.js"></script>
  <script src="../js/products.js"></script>
  <script src="../js/cart.js"></script>
  <script src="../js/login.js"></script>
</body>
</html>
