<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Orders — Angkor Mass Store</title>
  <link rel="stylesheet" href="../css/style.css">
</head>
<body>

  <div class="topbar"></div>

  <header>
    <div class="header-inner">
      <a class="logo" href="index.html"><span class="logo-kh">Market Phone</span></a>
      <div class="search-wrap">
        <div class="search-box">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/>
          </svg>
          <input type="text" id="searchInput" placeholder="Search for products...">
        </div>
      </div>
      <div class="header-icons">
        <button aria-label="cart" onclick="openCartSidebar()">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/><path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"/>
          </svg>
          <span id="cartBadge" style="display:none;">0</span>
        </button>
      </div>
    </div>
  </header>

  <nav>
    <button class="nav-toggle" id="navToggleBtn">☰ Menu</button>
    <div class="nav-inner"></div>
  </nav>

  <main>
    <div class="page-header">
      <h1>My Orders</h1>
      <p>Track and review your past orders</p>
    </div>

    <div id="ordersList"></div>
  </main>

  <footer>
    <div class="footer-bottom">&copy; 2026 Angkor Mass Store. All rights reserved.</div>
  </footer>

  <script src="../js/app.js"></script>
  <script src="../js/auth.js"></script>
  <script src="../js/products.js"></script>
  <script src="../js/cart.js"></script>
  <script src="../js/wishlist.js"></script>
  <script src="../js/orders.js"></script>
  <script src="../js/main.js"></script>
</body>
</html>
